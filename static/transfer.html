<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>질문 쓰기</title>
<style>
  :root{--bg:#f4f1ea;--panel:#fff;--ink:#2b2b2b;--sub:#6f6a61;--line:#e3ddd1;--accent:#2f6f5b;--accent-soft:#e5efe9;--warn:#b4453a;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;display:flex;justify-content:center;}
  .app{width:100%;max-width:620px;min-height:100vh;background:var(--panel);
    border-left:1px solid var(--line);border-right:1px solid var(--line);display:flex;flex-direction:column;}
  header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
  header .title{font-size:18px;font-weight:700;}
  header .who{font-size:13px;color:var(--sub);}
  main{padding:18px;flex:1;}
  .guide{font-size:14.5px;line-height:1.6;color:var(--ink);margin:0 0 14px;}
  .step{font-size:13px;color:var(--sub);margin-bottom:6px;}
  .facts{border:1px solid var(--line);border-radius:12px;background:#faf8f3;padding:14px 16px;margin-bottom:14px;}
  .facts .t{font-weight:700;margin-bottom:8px;}
  .facts ul{margin:0;padding-left:18px;font-size:15px;line-height:1.75;}
  textarea{width:100%;min-height:120px;resize:vertical;padding:12px;font-size:15px;line-height:1.5;
    border:1px solid var(--line);border-radius:12px;font-family:inherit;}
  textarea:focus{outline:none;border-color:var(--accent);}
  .row{display:flex;justify-content:flex-end;gap:8px;margin-top:10px;}
  button{padding:10px 18px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;}
  button:disabled{background:#b8c4bf;cursor:default;}
  .msg{font-size:14px;color:var(--sub);text-align:center;margin-top:40px;line-height:1.7;}
  .err{color:var(--warn);font-size:13.5px;margin-top:8px;}
  .overlay{position:fixed;inset:0;background:rgba(43,43,43,.45);display:flex;align-items:center;justify-content:center;z-index:10;}
  .card{background:#fff;border-radius:14px;padding:26px 24px;width:88%;max-width:420px;text-align:center;}
  .card h2{margin:0 0 6px;font-size:19px;}
  .card p{margin:0 0 16px;font-size:13.5px;color:var(--sub);}
  .card input{width:100%;padding:11px 12px;font-size:15px;border:1px solid var(--line);border-radius:10px;margin-bottom:12px;font-family:inherit;}
  .card .go{width:100%;}
  .pick{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px;}
  .pick button{min-width:56px;padding:9px 12px;background:#fff;color:var(--ink);border:1px solid var(--line);}
  .pick.nums button{min-width:44px;padding:8px 0;font-size:14px;}
  .pick button.sel{background:var(--accent);color:#fff;border-color:var(--accent);}
</style>
</head>
<body>
<div class="app">
  <header><div class="title">질문 쓰기</div><div class="who" id="who"></div></header>
  <main id="main"><div class="msg">반과 번호를 골라 들어와 줘.</div></main>
</div>

<div class="overlay" id="login">
  <div class="card">
    <h2>들어가기</h2>
    <p>우리 반과 내 번호를 골라 줘.</p>
    <div class="pick" id="clsPick"></div>
    <div class="pick nums" id="numPick"></div>
    <input id="pin" inputmode="numeric" maxlength="4" placeholder="입장 번호 4자리" style="display:none;">
    <button class="go" id="goBtn" disabled>들어가기</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<script>
let CLASSES=[], PICK={cls:null,num:null}, SID=null, VIEW=null, CUR=0, COMP=null;
const $=id=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

async function loadClasses(){
  try{ CLASSES=(await (await fetch("/api/classes")).json()).classes||[]; }catch(e){ CLASSES=[]; }
  $("clsPick").innerHTML=CLASSES.map(c=>`<button data-c="${esc(c.cid)}">${esc(c.cid)}반</button>`).join("")||'<span style="color:var(--sub);font-size:13px;">반 명단이 아직 없어.</span>';
}
$("clsPick").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  PICK.cls=b.dataset.c; PICK.num=null;
  [...$("clsPick").children].forEach(x=>x.classList.toggle("sel",x===b));
  const c=CLASSES.find(x=>x.cid===PICK.cls);
  $("numPick").innerHTML=c.nums.map(n=>`<button data-n="${n}">${parseInt(n,10)}</button>`).join("");
  $("pin").style.display=c.pin?"block":"none"; $("pin").value=""; ok();
});
$("numPick").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  PICK.num=b.dataset.n; [...$("numPick").children].forEach(x=>x.classList.toggle("sel",x===b)); ok();
});
$("pin").addEventListener("input",ok);
function ok(){
  const c=CLASSES.find(x=>x.cid===PICK.cls);
  $("goBtn").disabled=!(c&&PICK.num&&(!c.pin||/^\d{4}$/.test($("pin").value.trim())));
}
$("goBtn").addEventListener("click",()=>login({cls:PICK.cls,num:PICK.num,pin:$("pin").value.trim()}));

async function login(payload){
  $("loginErr").textContent="";
  const d=await (await fetch("/api/transfer/login",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(payload)})).json();
  if(!d.ok){ $("loginErr").textContent=d.error||"다시 해 줘."; return; }
  SID=d.sid; try{ sessionStorage.setItem("pgtsid",SID); }catch(e){}
  $("login").style.display="none";
  { const [c,n]=SID.split("-"); $("who").textContent=`${c}반 ${parseInt(n,10)}번`; }
  show(d);
}

function compReset(){ COMP={start:0,inputs:0,revisions:0,deleted:0,pastes:0,lastDel:false,lastLen:0}; }
function compMeta(){ return {revisions:COMP.revisions,deleted_chars:COMP.deleted,inputs:COMP.inputs,
  pastes:COMP.pastes,compose_ms:COMP.start?(Date.now()-COMP.start):0}; }

function show(v){
  VIEW=v;
  const m=$("main");
  if(!v.wave){ m.innerHTML='<div class="msg">지금은 쓸 과제가 없어.<br>선생님이 열어 주시면 다시 들어와 줘.</div>'; return; }
  const left=v.items.filter(it=>!it.done);
  if(!left.length){ m.innerHTML='<div class="msg">다 냈어. 수고했어!</div>'; return; }
  const it=left[0], no=v.items.indexOf(it)+1;
  compReset();
  m.innerHTML=
    `<p class="guide">${esc(v.instruction)}</p>`+
    `<div class="step">${no} / ${v.items.length}</div>`+
    `<div class="facts"><div class="t">${esc(it.title)}</div><ul>${it.facts.map(f=>`<li>${esc(f)}</li>`).join("")}</ul></div>`+
    `<textarea id="ans" placeholder="AI에게 보낼 질문을 여기에 써 줘"></textarea>`+
    `<div class="row"><button id="sub" disabled>제출하기</button></div><div class="err" id="err"></div>`;
  const ta=$("ans");
  ta.addEventListener("input",e=>{
    if(!COMP.start) COMP.start=Date.now();
    COMP.inputs++;
    const len=ta.value.length;
    const isDel=(e.inputType||"").startsWith("delete")||len<COMP.lastLen;
    if(isDel){ if(!COMP.lastDel) COMP.revisions++; COMP.deleted+=Math.max(0,COMP.lastLen-len); }
    if((e.inputType||"")==="insertFromPaste") COMP.pastes++;
    COMP.lastDel=isDel; COMP.lastLen=len;
    $("sub").disabled=!ta.value.trim();
  });
  $("sub").addEventListener("click",async()=>{
    if(!confirm("이대로 낼까? 내고 나면 고칠 수 없어.")) return;
    $("sub").disabled=true;
    const d=await (await fetch("/api/transfer/submit",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({student:SID,wave:v.wave,item:it.id,text:ta.value,meta:compMeta()})})).json();
    if(!d.ok){ $("err").textContent=d.error||"다시 해 줘."; $("sub").disabled=false; return; }
    show(d);
  });
}

(async()=>{
  await loadClasses();
  let saved=null; try{ saved=sessionStorage.getItem("pgtsid"); }catch(e){}
  if(saved) login({sid:saved});
})();
</script>
</body>
</html>
